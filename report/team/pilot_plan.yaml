# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu mỗi nhóm = 42 nhân viên mỗi nhóm, tổng 84 > 40 → không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 20 / 0,02 = 1.000 < 1.251 → không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 6 / 0,02 = 300 → loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: mỗi nhân viên ít nhất 299 yêu cầu (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên 20 + 20 không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251), nên chấp nhận mde = 0,06
#   (859 mỗi nhóm, mỗi nhân viên >= 299 yêu cầu). Nếu tác động thật chỉ 5 điểm thì power chỉ còn 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   4,25% (51/1.200); 3,97% trong phạm vi noi_dia + hang_nang. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu,
#   nên so với nhóm đối chứng (cao hơn >= 2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated), ở cả 12 depot; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, có điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]
  rollout_timing:
    early_stages: "Dự kiến 7 ngày ở bước 4 người và 7 ngày ở bước 10 người, tùy kết quả kiểm tra an toàn trước khi tăng phạm vi"
    primary_collection: "Chỉ lấy mẫu chỉ số chính ở bước 20 người dùng và 20 đối chứng đồng thời. Thu ít nhất 299 yêu cầu đủ điều kiện trên mỗi nhân viên ở cả hai nhóm"
    collection_estimate: "Khoảng 8 ngày nếu dùng toàn bộ 1.500 yêu cầu/ngày. Với phạm vi pilot 982/1.200 yêu cầu và 40 nhân viên, ước khoảng 10 ngày nếu lưu lượng chia đều. Kiểm tra số thực tế theo từng nhân viên"
    follow_up: "Chờ đủ cửa sổ không mở lại 7 ngày kể từ khi đóng mỗi yêu cầu trước khi đọc kết quả chính"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích D1 và D2
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot với 20 nhân viên dùng trợ lý"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng phân quyền theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu"
  stop_rules:
    - "NẾU phát hiện từ 1 ca hoàn tiền trùng hoặc đã báo hoàn mà đối soát xác nhận chưa ghi sổ TRONG bất kỳ bước nào, kể cả bước 4 người THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ tiếp tục đối soát"
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm dùng trợ lý vượt 6% TRONG bất kỳ kỳ kiểm tra hằng ngày nào ở mọi bước, trên các yêu cầu đã đủ 7 ngày theo dõi THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ tiếp tục giám sát"
    - "NẾU từ bước 10 người, tỉ lệ mở lại trong 7 ngày của nhóm dùng trợ lý cao hơn đối chứng đồng thời từ 2 điểm phần trăm TRONG 3 lần kiểm tra hằng ngày liên tiếp trên các yêu cầu đã đủ cửa sổ theo dõi THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ tiếp tục giám sát theo kế hoạch"
    - "NẾU chi phí biến đổi mỗi việc thành công (token, tool, xem lại và làm lại) vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ giữ phạm vi hiện tại theo kế hoạch"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-05"
  decision_readiness: "Nếu đến ngày dự kiến mà chưa đủ mẫu hoặc dữ liệu chưa đủ cửa sổ theo dõi, dời buổi quyết định đến khi đủ dữ liệu"
  simulated_inputs:
    - "Chi phí mỗi việc thành công 4.472 đ (A2) và theo loại 2.696 / 8.221 / 22.515 / 10.215 đ (A3), tính từ phut_xem_lai_simulated và phut_lam_lai_simulated"
    - "Chi phí cộng cố định 4.599 đ = 0,38× (A4)"
    - "Xem lại 100%: 11.743 đ = 0,98× (9 phút làm lại) và 12.415 đ = 1,03× (thời gian làm lại trung bình trong dữ liệu) (B4, simulated)"
    - "Ngưỡng chi phí 8.000 đ trong luật dừng, dựa trên bảng độ nhạy B1"
